# Framewise download website — HTTP preview before a domain is configured.
# Copy to /etc/nginx/sites-available/framewise, then enable the site.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/framewise;
    index index.html;
    charset utf-8;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml;
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }
    location ~* \.(css|js|svg|ico)$ {
        try_files $uri =404;
        expires 1h;
    }
    location ~ /\. {
        deny all;
    }
}
