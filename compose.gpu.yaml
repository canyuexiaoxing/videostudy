# Optional GPU deployment: docker compose -f compose.yaml -f compose.gpu.yaml up --build -d
services:
  agent-python:
    build:
      context: ./agent-python
      dockerfile: Dockerfile.gpu
    environment:
      OCR_DEVICE: gpu:0
      WHISPER_MODEL: small
      WHISPER_BATCH_SIZE: ${WHISPER_BATCH_SIZE:-4}
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    gpus: all
